name: "Task Issue"
description: "Small scoped implementation task (frontend, backend, database, testing, devops)."
title: "T<NN>: <Task title>"
labels: ["task"]
assignees: []

body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: "Which area label should be applied to this task?"
      options:
        - "frontend"
        - "backend"
        - "database"
        - "testing"
        - "devops"
      default: 0
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: "What needs to be done, in 2-3 sentences."
      placeholder: "Define the shared TypeScript interfaces used across the app and wire up the Supabase client."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: "Bullet list of the concrete files, components, and behaviors this task covers."
      placeholder: |
        - Create `app/types/index.ts` with interfaces: `Product`, `Category`, `CartItem`, `Order`, `User`.
        - Create `app/lib/supabase.ts` exporting a typed Supabase client.
        - Replace the JSON server calls in `app/lib/api.ts` with Supabase queries.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: "Links to ADRs, PRD sections, epics, and related tasks. N/A if none."
      placeholder: |
        - ADR-002: Database & Authentication Choice (Supabase)
        - PRD §2.1 (Product Catalog), §5.1 (Data source)
        - Epic #39 (Product Catalog & Search)
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: DoD
      description: "Definition of Done. Testable checklist; keep the standard last item."
      placeholder: |
        - [ ] `npm run build` succeeds with no TypeScript errors.
        - [ ] Feature works as described in the task.
        - [ ] PR reviewed by at least one team member.
    validations:
      required: true
